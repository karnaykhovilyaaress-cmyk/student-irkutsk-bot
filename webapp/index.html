<div id="splash">
  <div class="splash-logo-wrap">
    <svg class="splash-logo" viewBox="0 0 220 280" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="uFront" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FFFFFF"/>
          <stop offset="30%" stop-color="#E8FFFC"/>
          <stop offset="70%" stop-color="#7FE9FF"/>
          <stop offset="100%" stop-color="#3EE6D2"/>
        </linearGradient>
        <linearGradient id="uSide" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1FB8A6"/>
          <stop offset="100%" stop-color="#0E6A63"/>
        </linearGradient>
        <linearGradient id="uTop" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#A8F5EC"/>
          <stop offset="100%" stop-color="#3EE6D2"/>
        </linearGradient>
        <filter id="uGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="8" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <filter id="uShadow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="12"/>
        </filter>
      </defs>
      <ellipse cx="110" cy="245" rx="72" ry="12" fill="#0E6A63" opacity="0.35" filter="url(#uShadow)"/>
      <g transform="translate(8, 8)">
        <path d="M 55 40 L 55 180 C 55 215, 165 215, 165 180 L 165 40" fill="none" stroke="url(#uSide)" stroke-width="34" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M 110 40 L 110 200" fill="none" stroke="url(#uSide)" stroke-width="34" stroke-linecap="round"/>
      </g>
      <g transform="translate(0, -4)">
        <path d="M 55 40 L 55 180 C 55 215, 165 215, 165 180 L 165 40" fill="none" stroke="url(#uTop)" stroke-width="20" stroke-linejoin="round" stroke-linecap="round" opacity="0.6"/>
      </g>
      <g filter="url(#uGlow)">
        <path d="M 55 40 L 55 180 C 55 215, 165 215, 165 180 L 165 40" fill="none" stroke="url(#uFront)" stroke-width="32" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M 110 40 L 110 200" fill="none" stroke="url(#uFront)" stroke-width="32" stroke-linecap="round"/>
      </g>
    </svg>
  </div>
  <div class="splash-text" id="splashText">
    <span>STUDENT</span> <span>IRK</span>
  </div>
</div>

<div id="app" style="display:none">
  <header class="header">
    <h1 id="page-title">Расписание</h1>
    <button class="header-btn" id="refresh-btn" title="Обновить"><svg width="20" height="20"><use href="#ic-refresh"/></svg></button>
  </header>
  <main class="content" id="content">
    <div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>
  </main>
  <nav class="bottom-nav" id="bottom-nav">
    <button class="nav-btn" data-tab="schedule" title="Расписание"><svg width="22" height="22"><use href="#ic-schedule"/></svg><span>Пары</span></button>
    <button class="nav-btn" data-tab="tasks" title="Задачи"><svg width="22" height="22"><use href="#ic-task"/></svg><span>Задачи</span></button>
    <button class="nav-btn" data-tab="notes" title="Заметки"><svg width="22" height="22"><use href="#ic-note"/></svg><span>Заметки</span></button>
    <button class="nav-btn" data-tab="games" title="Игры"><svg width="22" height="22"><use href="#ic-game"/></svg><span>Игры</span></button>
    <button class="nav-btn" data-tab="ai" title="AI"><svg width="22" height="22"><use href="#ic-ai"/></svg><span>AI</span></button>
    <button class="nav-btn" data-tab="admin" title="Админ" style="display:none"><svg width="22" height="22"><use href="#ic-admin"/></svg><span>Админ</span></button>
    <button class="nav-btn" data-tab="profile" title="Профиль"><svg width="22" height="22"><use href="#ic-profile"/></svg><span>Профиль</span></button>
  </nav>
</div>

<div id="screen-flappy" class="fullscreen-screen" style="display:none">
  <canvas id="flappyCanvas"></canvas>
  <div class="flappy-top">
    <div class="flappy-score" id="flappyScore">0</div>
    <div class="flappy-record-pill">Рекорд: <b id="flappyBestTop">0</b></div>
  </div>
  <div class="flappy-overlay" id="flappyOverlay">
    <div class="flappy-card">
      <button class="flappy-close" id="flappyClose" title="Закрыть"><svg width="16" height="16"><use href="#ic-close"/></svg></button>
      <div class="flappy-card-title" id="flappyTitle">ДО ПАРЫ УСПЕТЬ</div>
      <div class="flappy-card-sub" id="flappySub">Пролетай между парами</div>
      <div class="flappy-card-score" id="flappyOverlayScore"></div>
      <div class="flappy-card-actions">
        <button class="btn" id="flappyStartBtn">ИГРАТЬ</button>
        <button class="btn btn-secondary" id="flappyRecordsBtn">РЕКОРДЫ</button>
      </div>
    </div>
  </div>
</div>

  </div>
  <div class="levels-hero">

  </div>
  <div class="levels-xpbar">
    <div class="levels-xpbar-fill" id="levelsXpFill" style="width:0%"></div>
    <span class="levels-xpbar-cur" id="levelsXpCur">0XP</span>
    <span class="levels-xpbar-next" id="levelsXpNext">500XP</span>
  </div>
  <div class="levels-ticker">
    <div class="levels-ticker-track">
      <span>STUDENT IRK</span><img class="coin" src="/assets/ic_shift.webp" alt="">

      <span>ЗАБИРАЙ НАГРАДЫ</span><svg width="16" height="16"><use href="#ic-gift"/></svg>

<div id="screen-bs" class="fullscreen-screen" style="display:none">
  <div class="bs-top">
    <button class="levels-back" id="bsBack" title="Назад"><svg width="20" height="20"><use href="#ic-chevron-left"/></svg></button>
    <div class="bs-title">МОРСКОЙ БОЙ</div>
  </div>
  <div class="bs-lobby" id="bsLobby">
    <div class="bs-bet-title">Ставка</div>
    <div class="bs-bets" id="bsBets"></div>
    <div class="bs-mode-grid">
      <button class="bs-mode" id="bsCreate"><svg viewBox="0 0 24 24"><use href="#ic-plus"/></svg>Создать</button>
      <button class="bs-mode" id="bsFind"><svg viewBox="0 0 24 24"><use href="#ic-refresh"/></svg>Найти</button>
      <button class="bs-mode" id="bsBot"><svg viewBox="0 0 24 24"><use href="#ic-ai"/></svg>С ботом</button>
    </div>
    <div class="bs-join-block">
      <div class="bs-join-label">Или введи код</div>
      <div class="bs-join">
        <input id="bsCode" type="tel" maxlength="6" placeholder="000000" inputmode="numeric">
        <button class="btn" id="bsJoin">ВОЙТИ</button>
      </div>
    </div>
  </div>
  <div class="bs-game" id="bsGame" style="display:none">
    <div class="bs-status" id="bsStatus">Ожидание...</div>
    <div class="bs-board-tabs">
      <button class="bs-board-tab active" data-bs-tab="mine">МОИ</button>
      <button class="bs-board-tab" data-bs-tab="enemy">ВРАГ</button>
    </div>
    <div class="bs-board-wrap">
      <div class="bs-field" id="bsMyField"></div>
      <div class="bs-field" id="bsEnemyField" style="display:none"></div>
    </div>
    <div class="bs-fleet" id="bsFleet"></div>
    <div class="bs-actions">
      <button class="btn btn-secondary" id="bsRandom">РАНДОМ</button>
      <button class="btn" id="bsReady">ГОТОВ</button>
      <button class="btn btn-red" id="bsSurrender">СДАТЬСЯ</button>
    </div>
  </div>
</div>

<div class="modal" id="modal" style="display:none">
  <div class="modal-backdrop"></div>
  <div class="modal-box">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="/chest.js"></script>
<script src="/app.js"></script>
</body>
</html>
