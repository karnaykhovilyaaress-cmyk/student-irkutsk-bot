  <div class="levels-top">
    <button class="levels-back" id="levelsBack">
      <svg width="20" height="20"><use href="#ic-chevron-left"/></svg>
    </button>
    <div class="levels-wallet">
      <svg width="16" height="16"><use href="#ic-soft"/></svg><b id="levelsSoft">0</b>
      <span style="opacity:.4">/</span>
      <svg width="16" height="16"><use href="#ic-hard"/></svg><b id="levelsHard">0</b>
    </div>
  </div>
  <div class="levels-hero">
    <div class="levels-hero-title">УРОВЕНЬ <span id="levelsCurrent">1</span></div>
    <div class="levels-hero-sub">до следующего <b id="levelsLeft">500XP</b></div>
    <div class="levels-xpbar">
      <div class="levels-xpbar-fill" id="levelsXpFill"></div>
      <span class="levels-xpbar-cur" id="levelsXpCur">0XP</span>
      <span class="levels-xpbar-next" id="levelsXpNext">500XP</span>
    </div>
  </div>
  <div class="levels-ticker"><div class="levels-ticker-track">
    <span>КОПИ XP В ЗАДАНИЯХ</span><svg width="14" height="14"><use href="#ic-xp"/></svg>
    <span>MYSTERY BOX</span><svg width="14" height="14"><use href="#ic-hard"/></svg>
    <span>КУПИТЬ</span><svg width="14" height="14"><use href="#ic-soft"/></svg>
    <span>КОПИ XP В ЗАДАНИЯХ</span><svg width="14" height="14"><use href="#ic-xp"/></svg>
    <span>MYSTERY BOX</span><svg width="14" height="14"><use href="#ic-hard"/></svg>
    <span>КУПИТЬ</span><svg width="14" height="14"><use href="#ic-soft"/></svg>
  </div></div>
  <div class="levels-list" id="levelsList"></div>
</div>

<div class="fullscreen-screen" id="screen-bs" style="display:none">
  <div class="bs-top">
    <button class="levels-back" id="bsBack">
      <svg width="20" height="20"><use href="#ic-chevron-left"/></svg>
    </button>
    <div class="bs-title">МОРСКОЙ БОЙ</div>
  </div>
  <div class="bs-lobby" id="bsLobby">
    <div class="bs-bet-title">СТАВКА</div>
    <div class="bs-bets" id="bsBets"></div>
    <div class="bs-mode-grid">
      <button class="bs-mode" id="bsCreate"><svg width="28" height="28"><use href="#ic-game-bs"/></svg>СОЗДАТЬ</button>
      <button class="bs-mode" id="bsFind"><svg width="28" height="28"><use href="#ic-star"/></svg>НАЙТИ</button>
      <button class="bs-mode" id="bsBot"><svg width="28" height="28"><use href="#ic-user"/></svg>С БОТОМ</button>
    </div>
    <div class="bs-join-block">
      <div class="bs-join-label">ИЛИ ВВЕДИ КОД</div>
      <div class="bs-join">
        <input id="bsCode" placeholder="000000" maxlength="6" inputmode="numeric">
        <button class="btn" id="bsJoin">ВОЙТИ</button>
      </div>
    </div>
  </div>
  <div class="bs-game" id="bsGame" style="display:none">
    <div class="bs-status" id="bsStatus">Расставляй корабли</div>
    <div class="bs-board-tabs">
      <button class="bs-board-tab active" data-bs-tab="mine">МОЁ ПОЛЕ</button>
      <button class="bs-board-tab" data-bs-tab="enemy">ПОЛЕ ВРАГА</button>
    </div>
    <div class="bs-board-wrap">
      <div class="bs-field" id="bsMyField"></div>
      <div class="bs-field" id="bsEnemyField" style="display:none"></div>
    </div>
    <div class="bs-fleet" id="bsFleet"></div>
    <div class="bs-actions">
      <button class="btn btn-secondary" id="bsRandom">СЛУЧАЙНО</button>
      <button class="btn" id="bsReady">ГОТОВ</button>
      <button class="btn btn-red" id="bsSurrender">СДАТЬСЯ</button>
    </div>
  </div>
</div>

<div class="modal" id="modal" style="display:none">
  <div class="modal-backdrop" data-close-modal></div>
  <div class="modal-box" id="modalBox">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="app.js?v=20"></script>
</body>
</html>
