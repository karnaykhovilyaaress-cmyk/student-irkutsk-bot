<!DOCTYPE html>
<html lang="ru">
<head>

  <symbol id="ic-note" viewBox="0 0 24 24"><path d="M5 4 H17 L21 8 V20 H5 Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 9 H15 M8 13 H17 M8 17 H13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="ic-ai" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="4" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="12" r="1.6" fill="currentColor"/><circle cx="15" cy="12" r="1.6" fill="currentColor"/><path d="M12 2 L12 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="2" r="1.4" fill="currentColor"/></symbol>
  <symbol id="ic-admin" viewBox="0 0 24 24"><path d="M12 3 L20 6 V12 C20 17, 16 20, 12 21 C8 20, 4 17, 4 12 V6 Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 12 L11 14 L15 10" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="ic-profile" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 20 C4 16, 8 14, 12 14 C16 14, 20 16, 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="ic-refresh" viewBox="0 0 24 24"><path d="M20 12 A8 8 0 1 1 16 5.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M16 2 L20 5.5 L16 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="ic-plus" viewBox="0 0 24 24"><path d="M12 5 V19 M5 12 H19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="ic-check" viewBox="0 0 24 24"><path d="M5 13 L10 18 L19 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="ic-close" viewBox="0 0 24 24"><path d="M6 6 L18 18 M18 6 L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="ic-chevron-left" viewBox="0 0 24 24"><path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="ic-chevron-right" viewBox="0 0 24 24"><path d="M9 5 L16 12 L9 19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="ic-pencil" viewBox="0 0 24 24"><path d="M4 20 L4 16 L14 6 L18 10 L8 20 Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M13 7 L17 11" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="ic-pdf" viewBox="0 0 24 24"><path d="M6 3 H15 L19 7 V21 H6 Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M15 3 V7 H19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 13 H12 M9 16 H15 M9 10 H11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="ic-chat" viewBox="0 0 24 24"><path d="M4 6 H20 V17 H13 L9 21 V17 H4 Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 11 H16 M8 14 H13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="ic-attach" viewBox="0 0 24 24"><path d="M20 11 L12 19 C9 22, 4 20, 4 15 C4 12, 6 10, 9 7 L16 2 C18 0, 22 2, 21 6 L14 13 C13 14, 11 13, 12 11 L18 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="ic-send" viewBox="0 0 24 24"><path d="M3 12 L21 4 L14 21 L11 14 Z" fill="currentColor"/></symbol>
  <symbol id="ic-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.5 9 C9.5 7, 14 7, 14 10 C14 12, 12 12, 12 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="17" r="1.2" fill="currentColor"/></symbol>
  <symbol id="ic-was" viewBox="0 0 24 24"><path d="M5 13 L10 18 L19 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="ic-missed" viewBox="0 0 24 24"><path d="M6 6 L18 18 M18 6 L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="ic-sick" viewBox="0 0 24 24"><path d="M12 3 L21 19 H3 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 9 V14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="16.5" r="1.2" fill="currentColor"/></symbol>
  <symbol id="ic-excused" viewBox="0 0 24 24"><path d="M12 3 L20 6 V12 C20 17, 16 20, 12 21 C8 20, 4 17, 4 12 V6 Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 12 L11 14 L15 10" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="ic-download" viewBox="0 0 24 24"><path d="M12 3 V15 M7 10 L12 15 L17 10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 19 H20" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="ic-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 8 V6 C16 4.9 15.1 4 14 4 H6 C4.9 4 4 4.9 4 6 V14 C4 15.1 4.9 16 6 16 H8" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
</svg>

<div id="splash">
  <div class="splash-logo-wrap">
    <svg class="splash-logo" viewBox="0 0 220 280" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="uFront" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FFFFFF"/><stop offset="30%" stop-color="#E8FFFC"/>
          <stop offset="70%" stop-color="#7FE9FF"/><stop offset="100%" stop-color="#3EE6D2"/>
        </linearGradient>
        <linearGradient id="uSide" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1FB8A6"/><stop offset="100%" stop-color="#0E6A63"/>
        </linearGradient>
        <linearGradient id="uTop" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#A8F5EC"/><stop offset="100%" stop-color="#3EE6D2"/>
        </linearGradient>
        <filter id="uGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="8" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="uShadow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="12"/>
        </filter>
      </defs>
      <ellipse cx="110" cy="245" rx="72" ry="12" fill="#0E6A63" opacity="0.35" filter="url(#uShadow)"/>
      <g transform="translate(8, 8)">
        <path d="M 55 40 L 55 180 C 55 215, 165 215, 165 180 L 165 40" fill="none" stroke="url(#uSide)" stroke-width="34" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M 110 40 L 110 200" fill="none" stroke="url(#uSide)" stroke-width="34" stroke-linecap="round"/>
      </g>
      <g transform="translate(0, -4)">
        <path d="M 55 40 L 55 180 C 55 215, 165 215, 165 180 L 165 40" fill="none" stroke="url(#uTop)" stroke-width="20" stroke-linejoin="round" stroke-linecap="round" opacity="0.6"/>
      </g>
      <g filter="url(#uGlow)">
        <path d="M 55 40 L 55 180 C 55 215, 165 215, 165 180 L 165 40" fill="none" stroke="url(#uFront)" stroke-width="32" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M 110 40 L 110 200" fill="none" stroke="url(#uFront)" stroke-width="32" stroke-linecap="round"/>
      </g>
    </svg>
  </div>
  <div class="splash-text"><span>STUDENT</span> <span>IRK</span></div>
</div>

<div id="app" style="display:none">
  <header class="header">
    <h1 id="page-title">Расписание</h1>
    <button class="header-btn" id="refresh-btn" title="Обновить"><svg width="20" height="20"><use href="#ic-refresh"/></svg></button>
  </header>
  <main class="content" id="content">
    <div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>
  </main>
  <nav class="bottom-nav" id="bottom-nav">
    <button class="nav-btn" data-tab="schedule" title="Расписание"><svg width="22" height="22"><use href="#ic-schedule"/></svg><span>Пары</span></button>
    <button class="nav-btn" data-tab="tasks" title="Задачи"><svg width="22" height="22"><use href="#ic-task"/></svg><span>Задачи</span></button>
    <button class="nav-btn" data-tab="notes" title="Заметки"><svg width="22" height="22"><use href="#ic-note"/></svg><span>Заметки</span></button>
    <button class="nav-btn" data-tab="ai" title="AI"><svg width="22" height="22"><use href="#ic-ai"/></svg><span>AI</span></button>
    <button class="nav-btn" data-tab="admin" title="Админ" style="display:none"><svg width="22" height="22"><use href="#ic-admin"/></svg><span>Админ</span></button>
    <button class="nav-btn" data-tab="profile" title="Профиль"><svg width="22" height="22"><use href="#ic-profile"/></svg><span>Профиль</span></button>
  </nav>
</div>

<div class="modal" id="modal" style="display:none">
  <div class="modal-backdrop"></div>
  <div class="modal-box">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="/app.js?v=17"></script>
</body>
</html>
