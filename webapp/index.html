<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1115">
<title>Student IRK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1115;--card:rgba(255,255,255,.065);--bd:rgba(255,255,255,.11);--tx:#eaf2f4;--tx2:#8fa4ab;--c:#3ee6d2;--c2:#7fe9ff;--red:#ff7070;--ok:#3ecf8e;--on:#04201d;--sh:0 10px 40px rgba(0,0,0,.35)}
@media(prefers-color-scheme:light){:root{--bg:#eef6f6;--card:rgba(255,255,255,.72);--bd:rgba(10,30,30,.09);--tx:#0a1415;--tx2:#586d73;--c:#14bfab;--c2:#2aa5c8;--red:#d93c3c;--ok:#1c9a64;--sh:0 10px 30px rgba(20,60,60,.12)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--c);outline-offset:2px}

/* живой фон */
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:60vmax;height:60vmax;left:-20vmax;top:-25vmax;background:#12b8a6}
.aurora i:nth-child(2){width:50vmax;height:50vmax;right:-18vmax;top:20vh;background:#2b7fff;animation-duration:28s;animation-delay:-8s;opacity:.32}
.aurora i:nth-child(3){width:45vmax;height:45vmax;left:10vmax;bottom:-25vmax;background:#7b4dff;animation-duration:34s;animation-delay:-14s;opacity:.28}
@media(prefers-color-scheme:light){.aurora i{opacity:.28}}
.aurora::after{content:"";position:absolute;inset:0;background:radial-gradient(420px circle at var(--mx,50%) var(--my,30%),rgba(62,230,210,.16),transparent 70%)}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}

/* вход */
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px;gap:22px}
.logo{font:italic 64px/.95 Anton,sans-serif;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(120deg,var(--c2),var(--c) 45%,#fff 90%);-webkit-background-clip:text;background-clip:text;color:transparent;animation:logoIn 1.1s cubic-bezier(.2,1.3,.4,1) both,shine 6s linear 1.2s infinite;background-size:220% 100%}
@keyframes logoIn{from{opacity:0;transform:translateY(24px) scale(.85) rotate(-3deg)}}
@keyframes shine{to{background-position:-220% 0}}
.login p{max-width:310px;margin:0;color:var(--tx2);font-size:16px;animation:rise .8s .35s both}
#w{min-height:48px;animation:rise .8s .55s both}
.login small{color:var(--tx2);max-width:280px;animation:rise .8s .7s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

/* каркас */
.app{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px 130px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
.hi{font:italic 30px/1 Anton,sans-serif;letter-spacing:.5px}
.sub{color:var(--tx2);font-size:13px;margin-top:6px}
.chip{background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:20px;padding:16px 18px;margin-bottom:10px}
.enter{animation:rise .5s calc(var(--i,0)*45ms) cubic-bezier(.2,.9,.3,1) both}
h2{font:italic 20px Anton,sans-serif;letter-spacing:.6px;margin:20px 0 10px}

/* кнопки */
.btn{background:var(--c);color:var(--on);border:0;border-radius:999px;padding:12px 22px;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .25s;box-shadow:0 6px 22px rgba(62,230,210,.32)}
.btn:hover{box-shadow:0 8px 30px rgba(62,230,210,.5)}
.btn:active{transform:scale(.95)}
.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.input{width:100%;background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:13px 15px;outline:0;transition:border-color .2s,box-shadow .2s}
.input:focus{border-color:var(--c);box-shadow:0 0 0 4px rgba(62,230,210,.16)}
textarea.input{resize:vertical;min-height:84px}

/* дни недели */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;min-width:54px;padding:10px 8px;border-radius:16px;background:var(--card);border:1px solid var(--bd);text-align:center;cursor:pointer;transition:transform .2s cubic-bezier(.3,1.6,.5,1),background .2s}
.day b{display:block;font-size:13px}
.day span{font-size:12px;color:var(--tx2)}
.day.on{background:var(--c);border-color:var(--c);color:var(--on);transform:translateY(-3px) scale(1.06);box-shadow:0 8px 22px rgba(62,230,210,.38)}
.day.on span{color:var(--on)}
.day.td:not(.on) b{color:var(--c)}
.wk{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px;color:var(--tx2);font-size:13px}

/* пары */
.les{display:flex;gap:14px;position:relative;overflow:hidden}
.les .t{min-width:58px}
.les .t b{display:block;font:italic 17px Anton,sans-serif;color:var(--c)}
.les .t span{font-size:12px;color:var(--tx2)}
.les .s{font-weight:700}
.les .m{font-size:13px;color:var(--tx2);margin-top:3px}
.les.done{opacity:.45}
.les.now{border-color:var(--c);animation:glow 2.6s ease-in-out infinite}
.les.now em{position:absolute;right:14px;top:14px;font-style:normal;font-size:12px;font-weight:700;background:var(--c);color:var(--on);border-radius:999px;padding:3px 10px}
@keyframes glow{50%{box-shadow:0 0 0 5px rgba(62,230,210,.16),0 0 34px rgba(62,230,210,.28)}}

/* задачи и заметки */
.task{display:flex;gap:12px;align-items:center}
.ck{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--tx2);background:none;cursor:pointer;display:grid;place-items:center;transition:all .25s cubic-bezier(.3,1.6,.5,1)}
.ck:hover{border-color:var(--c);transform:scale(1.12)}
.ck.ok{background:var(--ok);border-color:var(--ok);transform:scale(1.2)}
.task .x{flex:1;min-width:0;overflow-wrap:anywhere}
.task .d{font-size:12px;color:var(--tx2)}
.task .d.late{color:var(--red);font-weight:600}
.del{background:none;border:0;color:var(--tx2);font-size:22px;cursor:pointer;padding:2px 8px;border-radius:10px}
.del:hover{color:var(--red)}
.note b{display:block;margin-bottom:4px}
.note p{margin:0;color:var(--tx2);white-space:pre-wrap;overflow-wrap:anywhere}
.empty{text-align:center;color:var(--tx2);padding:44px 20px}
.empty b{display:block;color:var(--tx);font:italic 22px Anton,sans-serif;margin-bottom:6px}
.empty .btn{margin-top:14px}
.skel{height:76px;border-radius:20px;margin-bottom:10px;background:linear-gradient(90deg,var(--card) 25%,var(--bd) 50%,var(--card) 75%);background-size:200% 100%;animation:sk 1.4s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* профиль */
.ava{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--c),#2b7fff);display:grid;place-items:center;font:italic 30px Anton,sans-serif;color:var(--on)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats .card{text-align:center;margin:0}
.stats b{display:block;font:italic 30px Anton,sans-serif;color:var(--c)}
.stats span{font-size:12px;color:var(--tx2)}

/* нижнее меню */
.nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(420px,calc(100% - 28px));display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:999px;padding:6px;box-shadow:var(--sh);z-index:20}
.nav::before{content:"";position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);border-radius:999px;background:var(--c);transform:translateX(calc(var(--idx,0)*100%));transition:transform .45s cubic-bezier(.3,1.4,.5,1);box-shadow:0 4px 18px rgba(62,230,210,.45)}
.nav button{position:relative;background:none;border:0;padding:11px 0;font-weight:700;font-size:13px;color:var(--tx2);cursor:pointer;transition:color .25s}
.nav button.on{color:var(--on)}

/* выбор группы */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5);backdrop-filter:blur(5px);animation:fade .25s}
.sheet>div{width:100%;max-width:560px;max-height:84vh;display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--bd);border-radius:26px 26px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:up .4s cubic-bezier(.2,1.1,.4,1)}
.sheet .list{overflow-y:auto;display:grid;gap:8px}
.sheet .list button{text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:13px 15px;cursor:pointer;font-weight:600}
.sheet .list button:hover{border-color:var(--c)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips button{flex:0 0 auto}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
#toast{position:fixed;left:0;right:0;bottom:96px;display:flex;justify-content:center;pointer-events:none;z-index:60}
#toast div{background:var(--tx);color:var(--bg);padding:11px 20px;border-radius:999px;font-weight:600;animation:rise .3s both}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>
<div id="root"></div>
<div id="sheet"></div>
<div id="toast"></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
const BOT = 'student_irk38_bot';
let AUTH = (tg && tg.initData) || '';
if (!AUTH) { try { AUTH = localStorage.getItem('sirk_token') || ''; } catch (e) {} }

const S = { tab: 'sch', me: null, week: null, off: 0, day: null, tasks: null, notes: null, weather: '', groups: null, inst: '', q: '' };
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const TABS = [['sch', 'Пары'], ['tasks', 'Задачи'], ['notes', 'Заметки'], ['me', 'Профиль']];
const WD = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];

function toast(t) { const el = $('#toast'); el.innerHTML = '<div>' + esc(t) + '</div>'; clearTimeout(toast.t); toast.t = setTimeout(() => el.innerHTML = '', 2400); }
function nowIrk() { return new Date(Date.now() + new Date().getTimezoneOffset() * 60000 + 8 * 3600000); }
function fmt(d) { return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + d.getFullYear(); }
function parseD(s) { const [d, m, y] = s.split('.').map(Number); return new Date(y, m - 1, d); }
function mins(t) { const p = (t || '').split(':'); return p.length === 2 ? (+p[0]) * 60 + (+p[1]) : NaN; }

async function api(path, body) {
  let r;
  if (body) r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ initData: AUTH, ...body }) });
  else { const u = new URL(path, location.origin); u.searchParams.set('initData', AUTH); r = await fetch(u); }
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { logout(); throw new Error('auth'); }
  if (!r.ok) throw new Error(d.message || d.error || 'Что-то пошло не так');
  return d;
}

/* ---------- вход ---------- */
function loginScreen() {
  $('#root').innerHTML = `<div class="login"><div class="logo">Student<br>IRK</div>
    <p>Расписание, задачи и заметки студентов ИРНИТУ — всё в одном месте</p>
    <div id="w"></div><small>Войди через Telegram — твои данные из бота появятся здесь сами</small></div>`;
  const s = document.createElement('script');
  s.async = true; s.src = 'https://telegram.org/js/telegram-widget.js?22';
  s.dataset.telegramLogin = BOT; s.dataset.size = 'large'; s.dataset.radius = '20';
  s.dataset.onauth = 'onTgAuth(user)'; s.dataset.requestAccess = 'write';
  $('#w').appendChild(s);
}
window.onTgAuth = async u => {
  try {
    const r = await fetch('/api/tg-login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(u) });
    const d = await r.json();
    if (!d.token) throw 0;
    AUTH = d.token;
    try { localStorage.setItem('sirk_token', AUTH); } catch (e) {}
    boot();
  } catch (e) { toast('Не удалось войти. Попробуй ещё раз'); }
};
function logout() {
  AUTH = ''; try { localStorage.removeItem('sirk_token'); } catch (e) {}
  S.me = S.week = S.tasks = S.notes = null; loginScreen();
}

/* ---------- загрузка ---------- */
async function loadWeek() { try { S.week = await api('/api/week?offset=' + S.off); } catch (e) { if (e.message !== 'auth') S.week = { error: 1 }; }
  const days = (S.week && S.week.days) || [];
  const today = fmt(nowIrk());
  if (!days.find(d => d.date === S.day)) { const t = days.find(d => d.date === today); S.day = t ? t.date : (days[0] && days[0].date); } }
async function loadTasks() { try { S.tasks = (await api('/api/tasks?done=0')).tasks || []; } catch (e) { S.tasks = []; } }
async function loadNotes() { try { S.notes = (await api('/api/notes')).notes || []; } catch (e) { S.notes = []; } }
async function loadMe() { S.me = await api('/api/me'); }
async function loadWeather() { try { S.weather = (await api('/api/weather')).line || ''; } catch (e) {} }

async function boot() {
  if (!AUTH) return loginScreen();
  try { await loadMe(); } catch (e) { if (e.message !== 'auth') toast(e.message); return; }
  shell(); paint();
  loadWeather().then(head);
  await go(S.tab);
}
async function go(t) {
  S.tab = t; paint(true);
  if (t === 'sch' && S.me.group && !S.week) await loadWeek();
  if (t === 'tasks') await loadTasks();
  if (t === 'notes') await loadNotes();
  if (t === 'me') await loadMe();
  if (S.tab === t) paint();
}

/* ---------- каркас ---------- */
function shell() {
  $('#root').innerHTML = `<div class="app"><div class="top" id="head"></div><div id="view"></div></div>
  <nav class="nav" id="nav">${TABS.map(t => `<button data-a="tab" data-v="${t[0]}">${t[1]}</button>`).join('')}</nav>`;
  head();
}
function head() {
  const h = $('#head'); if (!h || !S.me) return;
  const hr = nowIrk().getHours();
  const hello = hr < 5 ? 'Не спится' : hr < 12 ? 'Доброе утро' : hr < 18 ? 'Добрый день' : 'Добрый вечер';
  const name = S.me.first_name || 'студент';
  h.innerHTML = `<div><div class="hi">${hello}, ${esc(name)}</div><div class="sub">${S.me.group ? esc(S.me.group) : 'Группа не выбрана'}</div></div>${S.weather ? `<div class="chip">${esc(S.weather.split(' · ').slice(0, 2).join(' · '))}</div>` : ''}`;
}
function paint(loading) {
  const v = $('#view'); if (!v) return;
  const idx = TABS.findIndex(t => t[0] === S.tab);
  $('#nav').style.setProperty('--idx', idx);
  document.querySelectorAll('#nav button').forEach((b, i) => b.classList.toggle('on', i === idx));
  const sk = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  const views = { sch: viewSch, tasks: viewTasks, notes: viewNotes, me: viewMe };
  v.innerHTML = loading ? sk : views[S.tab]();
}
function empty(t, s, btn) { return `<div class="empty enter"><b>${t}</b>${s}${btn || ''}</div>`; }

/* ---------- расписание ---------- */
function viewSch() {
  if (!S.me.group) return empty('Выбери группу', 'Тогда здесь появятся твои пары', '<br><button class="btn" data-a="pick">Выбрать группу</button>');
  const w = S.week; if (!w) return '<div class="skel"></div><div class="skel"></div>';
  if (w.error || !w.days || !w.days.length) return empty('Расписание недоступно', 'Сайт вуза не ответил. Попробуй позже', '<br><button class="btn ghost" data-a="reload">Обновить</button>');
  const today = fmt(nowIrk());
  const days = w.days.map(d => { const dt = parseD(d.date); return `<div class="day ${d.date === S.day ? 'on' : ''} ${d.date === today ? 'td' : ''}" data-a="day" data-v="${d.date}"><b>${WD[dt.getDay()]}</b><span>${d.date.slice(0, 5)}</span></div>`; }).join('');
  const day = w.days.find(d => d.date === S.day) || w.days[0];
  const n = nowIrk(), nm = n.getHours() * 60 + n.getMinutes(), isT = day.date === today;
  const les = (day.lessons || []).map((l, i) => {
    const s = mins(l.time), e = mins(l.timeEnd);
    const st = !isT ? '' : (nm >= s && nm < e) ? 'now' : (nm >= e ? 'done' : '');
    return `<div class="card les ${st} enter" style="--i:${i}"><div class="t"><b>${esc(l.time)}</b><span>${esc(l.timeEnd || '')}</span></div><div><div class="s">${esc(l.subject)}</div><div class="m">${[l.type, l.teacher, l.auditorium ? 'ауд. ' + l.auditorium : ''].filter(Boolean).map(esc).join(' · ')}</div>${l.subgroup ? `<div class="m">подгруппа ${esc(l.subgroup)}</div>` : ''}</div>${st === 'now' ? '<em>идёт сейчас</em>' : ''}</div>`;
  }).join('');
  const wl = S.off === 0 ? 'Эта неделя' : S.off > 0 ? 'Через ' + S.off + ' нед.' : S.off + ' нед. назад';
  return `<div class="wk"><button class="btn ghost" data-a="wk" data-v="-1">‹</button><span>${wl}</span><button class="btn ghost" data-a="wk" data-v="1">›</button></div>
  <div class="days">${days}</div>${les || empty('Пар нет', 'Можно выдохнуть или занять день задачами')}`;
}

/* ---------- задачи ---------- */
function viewTasks() {
  const form = `<div class="card enter"><input class="input" id="tx" placeholder="Что нужно сделать?" maxlength="200"><div class="row" style="margin-top:10px"><input class="input" id="td" type="date" style="flex:1"><button class="btn" data-a="addTask">Добавить</button></div></div>`;
  if (!S.tasks) return form + '<div class="skel"></div>';
  const list = S.tasks.map((t, i) => `<div class="card task enter" style="--i:${i + 1}"><button class="ck" data-a="done" data-v="${t.id}" aria-label="Готово"></button><div class="x">${esc(t.text)}${t.due_date ? `<div class="d ${t.overdue ? 'late' : ''}">до ${esc(t.due_date)}${t.due_time ? ' ' + esc(t.due_time) : ''}${t.overdue ? ' — просрочено' : ''}</div>` : ''}</div><button class="del" data-a="delTask" data-v="${t.id}" aria-label="Удалить">×</button></div>`).join('');
  return form + (list || empty('Задач нет', 'Добавь первую — и не забудешь про лабу'));
}

/* ---------- заметки ---------- */
function viewNotes() {
  const form = `<div class="card enter"><input class="input" id="ns" placeholder="Предмет или тема" maxlength="100" style="margin-bottom:8px"><textarea class="input" id="nt" placeholder="Текст заметки" maxlength="5000"></textarea><button class="btn" data-a="addNote" style="margin-top:10px">Сохранить заметку</button></div>`;
  if (!S.notes) return form + '<div class="skel"></div>';
  const list = S.notes.map((n, i) => `<div class="card note enter" style="--i:${i + 1}"><div class="row" style="justify-content:space-between"><b>${esc(n.subject)}</b><button class="del" data-a="delNote" data-v="${n.id}" aria-label="Удалить">×</button></div><p>${esc(n.text)}</p></div>`).join('');
  return form + (list || empty('Заметок нет', 'Конспекты и мысли лучше хранить здесь'));
}

/* ---------- профиль ---------- */
function viewMe() {
  const m = S.me;
  return `<div class="card enter row" style="gap:16px"><div class="ava">${esc((m.first_name || '?')[0])}</div><div><b style="font-size:18px">${esc(m.first_name || 'Студент')}</b><div class="sub">${m.username ? '@' + esc(m.username) : ''}</div></div></div>
  <div class="stats"><div class="card enter" style="--i:1"><b>${m.tasks_active || 0}</b><span>активных задач</span></div><div class="card enter" style="--i:2"><b>${m.notes_count || 0}</b><span>заметок</span></div></div>
  <h2>Учёба</h2><div class="card enter" style="--i:3"><b>${m.group ? esc(m.group) : 'Группа не выбрана'}</b>
  <div class="row" style="margin-top:12px"><button class="btn" data-a="pick">${m.group ? 'Сменить группу' : 'Выбрать группу'}</button></div>
  <div class="sub" style="margin:14px 0 8px">Подгруппа</div><div class="row">${[[0, 'Все'], [1, '1'], [2, '2']].map(x => `<button class="btn ${(m.subgroup || 0) === x[0] ? '' : 'ghost'}" data-a="sub" data-v="${x[0]}">${x[1]}</button>`).join('')}</div></div>
  <div class="card enter" style="--i:4;margin-top:14px"><div class="sub" style="margin-bottom:10px">Уведомления, AI-помощник, стипендия и презентации пока работают в боте</div><button class="btn ghost" data-a="logout">Выйти</button></div>`;
}

/* ---------- выбор группы ---------- */
async function pick() {
  if (!S.groups) { try { S.groups = (await api('/api/groups')).groups; } catch (e) { return toast('Не удалось загрузить группы'); } }
  S.inst = S.inst || Object.keys(S.groups)[0]; S.q = '';
  $('#sheet').innerHTML = `<div class="sheet" data-a="closeSheet"><div><div class="hi" style="font-size:24px">Твоя группа</div>
  <div class="chips" id="chips"></div><input class="input" id="gq" placeholder="Поиск, например ИСТб-24" autocomplete="off"><div class="list" id="gl"></div></div></div>`;
  $('.sheet > div').onclick = e => e.stopPropagation();
  $('#gq').oninput = e => { S.q = e.target.value; glist(); };
  chips(); glist();
}
function chips() { $('#chips').innerHTML = Object.keys(S.groups).map(k => `<button class="btn ${k === S.inst ? '' : 'ghost'}" data-a="inst" data-v="${esc(k)}">${esc(k)}</button>`).join(''); }
function glist() {
  const q = S.q.trim().toLowerCase();
  const src = q ? Object.values(S.groups).flat() : S.groups[S.inst];
  const r = src.filter(g => !q || g.name.toLowerCase().includes(q)).slice(0, 80);
  $('#gl').innerHTML = r.length ? r.map(g => `<button data-a="grp" data-v="${esc(g.id)}" data-n="${esc(g.name)}">${esc(g.name)}</button>`).join('') : '<div class="empty">Ничего не найдено</div>';
}

/* ---------- действия ---------- */
const act = {
  tab: b => go(b.dataset.v),
  day: b => { S.day = b.dataset.v; paint(); },
  wk: async b => { S.off += +b.dataset.v; S.week = null; paint(true); await loadWeek(); paint(); },
  reload: async () => { S.week = null; paint(true); await loadWeek(); paint(); },
  pick, inst: b => { S.inst = b.dataset.v; chips(); glist(); },
  closeSheet: () => { $('#sheet').innerHTML = ''; },
  grp: async b => {
    try {
      await api('/api/set-group', { group_id: b.dataset.v, group_name: b.dataset.n, subgroup: S.me.subgroup || 0 });
      $('#sheet').innerHTML = ''; await loadMe(); S.week = null; head(); toast('Группа сохранена'); await go(S.tab);
    } catch (e) { toast(e.message); }
  },
  sub: async b => { try { await api('/api/set-subgroup', { subgroup: +b.dataset.v }); S.me.subgroup = +b.dataset.v; S.week = null; paint(); } catch (e) { toast(e.message); } },
  addTask: async () => {
    const text = $('#tx').value.trim(); if (!text) return toast('Напиши, что нужно сделать');
    const dv = $('#td').value; let due = null;
    if (dv) { const [y, m, d] = dv.split('-'); due = `${d}.${m}.${y}`; }
    try { await api('/api/task-add', { text, due_date: due, priority: 2 }); await loadTasks(); paint(); toast('Задача добавлена'); } catch (e) { toast(e.message); }
  },
  done: async b => {
    b.classList.add('ok'); b.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24"><path d="M5 13l5 5 9-11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    try { await api('/api/task-update', { id: +b.dataset.v, done: true }); setTimeout(async () => { await loadTasks(); paint(); }, 450); } catch (e) { toast(e.message); }
  },
  delTask: async b => { try { await api('/api/task-delete', { id: +b.dataset.v }); await loadTasks(); paint(); } catch (e) { toast(e.message); } },
  addNote: async () => {
    const subject = $('#ns').value.trim(), text = $('#nt').value.trim();
    if (!subject || !text) return toast('Заполни тему и текст');
    try { await api('/api/note-save', { subject, text, tags: '' }); await loadNotes(); paint(); toast('Заметка сохранена'); } catch (e) { toast(e.message); }
  },
  delNote: async b => { try { await api('/api/note-delete', { id: +b.dataset.v }); await loadNotes(); paint(); } catch (e) { toast(e.message); } },
  logout
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (b && act[b.dataset.a]) { if (b.classList.contains('sheet') && e.target !== b) return; act[b.dataset.a](b); }
});
document.addEventListener('pointermove', e => {
  const r = document.documentElement.style;
  r.setProperty('--mx', e.clientX + 'px'); r.setProperty('--my', e.clientY + 'px');
}, { passive: true });
setInterval(() => { if (S.tab === 'sch' && S.week && !$('#sheet').innerHTML) paint(); }, 60000);

boot();
</script>
</body>
</html>
