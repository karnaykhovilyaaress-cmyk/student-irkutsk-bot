<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>STUDENT IRK</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=18">
</head>
<body>

<div id="splash">
  <div class="splash-logo">
    <svg viewBox="0 0 200 220" width="150" height="165" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gWhite" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#D9FFFB"/>
        </linearGradient>
        <linearGradient id="gCyan" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#7FE9FF"/><stop offset="100%" stop-color="#1FB8A6"/>
        </linearGradient>
        <linearGradient id="gCyanD" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3EE6D2"/><stop offset="100%" stop-color="#0E6A63"/>
        </linearGradient>
      </defs>
      <polygon points="100,18 180,58 100,98 20,58" fill="url(#gWhite)"/>
      <polygon points="100,98 100,118 60,100 60,80" fill="url(#gCyanD)"/>
      <polygon points="100,98 100,118 140,100 140,80" fill="url(#gCyanD)"/>
      <rect x="98" y="98" width="4" height="22" fill="url(#gCyan)"/>
      <circle cx="100" cy="122" r="5" fill="#7FE9FF"/>
      <line x1="155" y1="62" x2="155" y2="96" stroke="#7FE9FF" stroke-width="3"/>
      <rect x="150" y="96" width="10" height="16" rx="4" fill="#7FE9FF"/>
      <path d="M35 122 C35 100 80 95 100 112 C120 129 165 132 165 154 C165 178 120 185 100 168 C80 151 35 148 35 122 Z" fill="url(#gCyan)" opacity="0.92"/>
      <polygon points="108,102 72,146 96,146 84,182 134,134 108,134 122,102" fill="#FFFFFF" stroke="#3EE6D2" stroke-width="2"/>
      <path d="M168 100 C180 118 188 134 182 156 C175 172 158 176 154 160 C150 142 162 122 168 100 Z" fill="url(#gCyanD)"/>
      <path d="M170 118 C177 130 180 142 175 152 C170 160 162 160 162 146 C162 134 166 126 170 118 Z" fill="#7FE9FF" opacity="0.85"/>
    </svg>
  </div>
  <div class="splash-text">STUDENT IRK</div>
</div>

<div id="app" style="display:none">
  <header class="header">
    <h1 id="page-title">Расписание</h1>
    <button class="header-btn" id="refresh-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
    </button>
  </header>

  <main class="content" id="content">
    <div class="loading">Загрузка...</div>
  </main>

  <nav class="bottom-nav" id="bottom-nav">
    <button class="nav-btn active" data-tab="schedule">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Пары</span>
    </button>
    <button class="nav-btn" data-tab="tasks">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <span>Задачи</span>
    </button>
    <button class="nav-btn" data-tab="games">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="3"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><circle cx="16" cy="11" r="1"/><circle cx="18" cy="13" r="1"/></svg>
      <span>Игры</span>
    </button>
    <button class="nav-btn" data-tab="notes">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span>Заметки</span>
    </button>
    <button class="nav-btn" data-tab="ai">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <span>AI</span>
    </button>
    <button class="nav-btn" data-tab="admin" style="display:none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/></svg>
      <span>Админ</span>
    </button>
    <button class="nav-btn" data-tab="profile">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Профиль</span>
    </button>
  </nav>
</div>

<div class="fullscreen-screen" id="screen-flappy" style="display:none">
  <div class="flappy-top">
    <div class="flappy-score" id="flappyScore">0</div>
    <div class="flappy-record-pill">Рекорд: <b id="flappyBestTop">0</b></div>
  </div>
  <canvas id="flappyCanvas"></canvas>
  <div class="flappy-overlay" id="flappyOverlay">
    <div class="flappy-card">
      <div class="flappy-card-title" id="flappyTitle">ДО ПАРЫ УСПЕТЬ</div>
      <div class="flappy-card-sub" id="flappySub">Пролетай между парами, не задень границы</div>
      <div class="flappy-card-score" id="flappyOverlayScore"></div>
      <div class="flappy-card-actions">
        <button class="btn" id="flappyStartBtn">ИГРАТЬ</button>
        <button class="btn btn-secondary" id="flappyRecordsBtn">РЕКОРДЫ</button>
      </div>
      <button class="flappy-close" id="flappyClose">✕</button>
    </div>
  </div>
</div>

<div class="fullscreen-screen" id="screen-levels" style="display:none">
  <div class="levels-top">
    <button class="levels-back" id="levelsBack">‹</button>
    <div class="levels-wallet">
      <span>❄</span><b id="levelsSoft">0</b>
      <span style="opacity:.4">/</span>
      <span>🔥</span><b id="levelsHard">0</b>
    </div>
  </div>
  <div class="levels-hero">
    <div class="levels-hero-title">УРОВЕНЬ <span id="levelsCurrent">1</span></div>
    <div class="levels-hero-sub">до следующего <b id="levelsLeft">500XP</b></div>
    <div class="levels-xpbar">
      <div class="levels-xpbar-fill" id="levelsXpFill"></div>
      <span class="levels-xpbar-cur" id="levelsXpCur">0XP</span>
      <span class="levels-xpbar-next" id="levelsXpNext">500XP</span>
    </div>
  </div>
  <div class="levels-ticker"><div class="levels-ticker-track">
    <span>КОПИ XP В ЗАДАНИЯХ</span><span>🔥</span><span>MYSTERY BOX</span><span>🔥</span>
    <span>КУПИТЬ</span><span>🔥</span><span>КОПИ XP В ЗАДАНИЯХ</span><span>🔥</span>
    <span>MYSTERY BOX</span><span>🔥</span><span>КУПИТЬ</span><span>🔥</span>
  </div></div>
  <div class="levels-list" id="levelsList"></div>
</div>

<div class="fullscreen-screen" id="screen-bs" style="display:none">
  <div class="bs-top">
    <button class="levels-back" id="bsBack">‹</button>
    <div class="bs-title">МОРСКОЙ БОЙ</div>
  </div>
  <div class="bs-lobby" id="bsLobby">
    <div class="bs-bet-title">СТАВКА</div>
    <div class="bs-bets" id="bsBets"></div>
    <div class="bs-mode-grid">
      <button class="bs-mode" id="bsCreate"><span>🎯</span>СОЗДАТЬ</button>
      <button class="bs-mode" id="bsFind"><span>🔍</span>НАЙТИ</button>
      <button class="bs-mode" id="bsBot"><span>🤖</span>С БОТОМ</button>
    </div>
    <div class="bs-join-block">
      <div class="bs-join-label">ИЛИ ВВЕДИ КОД</div>
      <div class="bs-join">
        <input id="bsCode" placeholder="000000" maxlength="6" inputmode="numeric">
        <button class="btn" id="bsJoin">ВОЙТИ</button>
      </div>
    </div>
  </div>
  <div class="bs-game" id="bsGame" style="display:none">
    <div class="bs-status" id="bsStatus">Расставляй корабли</div>
    <div class="bs-board-tabs">
      <button class="bs-board-tab active" data-bs-tab="mine">МОЁ ПОЛЕ</button>
      <button class="bs-board-tab" data-bs-tab="enemy">ПОЛЕ ВРАГА</button>
    </div>
    <div class="bs-board-wrap">
      <div class="bs-field" id="bsMyField"></div>
      <div class="bs-field" id="bsEnemyField" style="display:none"></div>
    </div>
    <div class="bs-fleet" id="bsFleet"></div>
    <div class="bs-actions">
      <button class="btn btn-secondary" id="bsRandom">СЛУЧАЙНО</button>
      <button class="btn" id="bsReady">ГОТОВ</button>
      <button class="btn btn-red" id="bsSurrender">СДАТЬСЯ</button>
    </div>
  </div>
</div>

<div class="modal" id="modal" style="display:none">
  <div class="modal-backdrop" data-close-modal></div>
  <div class="modal-box" id="modalBox">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="app.js?v=18"></script>
</body>
</html>
